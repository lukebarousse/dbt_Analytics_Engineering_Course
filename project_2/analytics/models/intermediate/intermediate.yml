models:
  - name: int_job_postings_enriched
    description: >
      The "do the thinking once" layer: stg_job_postings passed through at scrape
      grain (one row per posting per scrape day) plus salary_year_avg, the one
      business rule every downstream model inherits instead of restating. All other
      columns arrive unchanged from staging and are documented there. Tested by
      assert_salaries_sane (singular, warn), which reads this model because only
      scrape grain still shows garbage rows that fct's latest-scrape-wins dedupe
      would hide.
    columns:
      - name: job_id
        description: >
          Posting id; still repeats across scrape days here. Uniqueness is promised,
          and tested, at fct_job_postings.
      - name: salary_year_avg
        description: >
          Annualized average salary in USD, computed here and only here: rows with an
          explicit currency marker are excluded (null salary_currency = assumed USD),
          yearly pay averages the parsed range (a single value is its own range),
          hourly pay averages the range x 2080, and month/day/week periods stay null
          rather than guessed. Downstream models filter salary_year_avg is not null;
          none of them restate this rule.

  - name: jobs_per_month
    description: >
      Distinct jobs scraped per month; the ingest lesson's load-validation query,
      promoted to a model. Rides int_job_postings_enriched at scrape grain, so its
      numbers stayed put when fct_job_postings started deduping; monthly
      deduped-per-job counts are fct's grain to serve, not this model's claim.
    config:
      meta:
        owner: luke
        tier: silver
    columns:
      - name: month
        description: Scrape month (date_trunc of search_date).
        data_tests:
          - not_null
          - unique
      - name: postings
        description: Distinct job_ids scraped in the month.

  - name: jobs_pivot
    description: >
      One-row pivot of distinct jobs per search role, written by a Jinja loop; read
      the compiled file for the SQL dbt wrote. Time-free by design: role columns
      over all history, because a month axis would count re-scraped jobs once per
      month.
    columns:
      - name: data_analyst_postings
        description: Distinct jobs found by the 'Data Analyst' search.
      - name: data_engineer_postings
        description: Distinct jobs found by the 'Data Engineer' search.
      - name: data_scientist_postings
        description: Distinct jobs found by the 'Data Scientist' search.
