# raw.jobs = the landing zone (schema named for the SOURCE SYSTEM, dbt convention), created ONCE by scripts/load_raw.py (the ingestion notebook) —
# dbt didn't build it, so it's declared as a source (the 1.5 lesson, cloud edition)
sources:
  - name: jobs
    database: raw
    schema: jobs
    tables:
      - name: raw_job_postings
        description: Raw scraped postings, one row per posting per scrape day. As landed.
      - name: raw_job_skills
        description: Pre-extracted skill keywords per job_id. As landed.
