models:
  - name: fct_job_postings
    description: >
      One row per job posting — latest scrape wins. Incremental (merge on job_id):
      re-scrapes update in place, new jobs insert.
    config:
      meta:
        owner: luke
        tier: gold
    columns:
      - name: job_id
        description: Posting id from the scraper; the grain and the merge key.
      - name: job_title
        description: Title as posted.
      - name: search_term
        description: >
          Search that found the posting. Latest scrape wins, so a job re-scraped
          under a different search carries its most recent term.
      - name: company_name
        description: Employer, trimmed upstream; natural key into dim_company.
      - name: job_location
        description: Location text as posted.
      - name: source_platform
        description: Posting platform; the scraper's "via " prefix stripped upstream.
      - name: job_schedule_type
        description: Schedule as posted; null when the posting didn't say.
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: search_date
        description: Date of the winning (latest) scrape; the incremental high-water mark.
      - name: salary_min
        description: Lower bound parsed from the raw salary text; null when absent or unparseable.
      - name: salary_max
        description: Upper bound parsed from the raw salary text; null when absent or unparseable.
      - name: salary_avg
        description: >
          Midpoint of the parsed salary range, unit-agnostic — pair with salary_period
          and salary_currency filters (the course convention: currency = 'USD' and
          period = 'year' for comparable annual pay).
      - name: salary_period
        description: Pay period parsed from the raw salary text (year, month, week, day, hour).
      - name: salary_currency
        description: >
          Currency of the salary columns; 'USD' when no marker was present (documented
          assumption), null only when the posting has no salary.
      - name: has_health_insurance
        description: Posting extensions mention health insurance.
      - name: has_dental_insurance
        description: Posting extensions mention dental insurance.
      - name: has_paid_time_off
        description: Posting extensions mention paid time off.
      - name: has_no_degree_mentioned
        description: Posting extensions mention no degree required.

