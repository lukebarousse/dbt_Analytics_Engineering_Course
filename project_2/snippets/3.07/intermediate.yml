models:
  - name: int_skill_observations
    description: >
      One row per skill_id observed in the raw skill rows: the "do the thinking once"
      layer re-grains 3,304,574 (job, skill keyword) rows into per-skill demand counts.
      Aggregates staging, not the star, so the counts would include orphan rows whose
      job never made fct (0 today). Observed in the wild, documented rather than hidden.
      dim_skill joins these counts onto the seed taxonomy and serves them.
    columns:
      - name: skill_id
        description: Skill key; the grain.
      - name: postings_with_skill
        description: >
          Distinct jobs observed with this skill in staging. Orphan rows would count
          here by design; there are 0 today.
