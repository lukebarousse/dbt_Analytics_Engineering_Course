# Ships with the repo so there is zero profile setup: dbt finds this file
# automatically when you run dbt from inside the job_postings/ folder.
#
# dev  (default) = local DuckDB. The whole course runs here.
# prod           = BigQuery. Used only in Module 6 (Shipping to production).
#                  Set GCP_PROJECT to your own BigQuery sandbox project id.

job_postings:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: job_postings.duckdb
      threads: 4
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'your-gcp-project-id') }}"
      dataset: job_postings
      location: US
      threads: 4
