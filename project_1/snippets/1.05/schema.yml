models:
  - name: job_postings
    description: Cleaned postings; nine named columns, scraper error rows removed.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: The scraper's posting id; re-scraped postings repeat it.
      - name: job_title
        description: Posting title as scraped; blank on the scraper's error rows.
      - name: company_name
        description: Employer name as scraped.
      - name: job_location
        description: Posting location as scraped.
      - name: job_via
        description: Posting platform as scraped ('via LinkedIn' — the prefix is the scraper's artifact).
      - name: job_schedule_type
        description: Schedule as posted; null when the posting didn't say.
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: search_date
        description: Scrape day.
      - name: search_term
        description: Role the scraper searched for.

  - name: jobs_per_month
    description: Monthly posting counts by role.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: Posting month, truncated from search_date.
      - name: role
        description: Search role (search_term).
      - name: postings
        description: Postings counted for the role that month.

  - name: top_locations
    description: Top 10 locations by posting count.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: Posting location; the grain.
      - name: postings
        description: Postings counted for the location.
