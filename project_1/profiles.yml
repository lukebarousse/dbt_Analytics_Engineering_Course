# Project #1 runs entirely on local DuckDB — one database, one target.
# (It's named "dev" on purpose: dev vs prod becomes a real concept in
# Section 3, on Project #2, where dev and prod are BigQuery datasets.)

job_postings:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/dev.duckdb
      threads: 4
