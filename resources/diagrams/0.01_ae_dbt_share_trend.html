<!doctype html><html><head><meta charset="utf-8"><title>dbt in Analytics Engineer Postings</title>
<style>
html,body{margin:0;background:#0A0913;width:1920px;height:1080px;overflow:hidden;font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;cursor:pointer}
text{user-select:none}

<script>
// Deterministic timeline: render(t) draws the frame for time t (seconds).
// ?t=1.5  freezes that frame (used for PNG/MP4 export). ?still=1 = final frame.
// Click or press space to replay. Autoplays 0.4 s after load.
const Q=new URLSearchParams(location.search);
const fixedTime=()=>Q.has('still')?DUR:(Q.has('t')?parseFloat(Q.get('t')):null);
const easeOut=x=>1-Math.pow(1-x,3), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,t0,d)=>clamp((t-t0)/d,0,1);
let t0=null,raf=null;
function play(){t0=performance.now()+400;cancelAnimationFrame(raf);const f=()=>{const t=(performance.now()-t0)/1000;render(clamp(t,0,DUR));if(t<DUR)raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);}
window.addEventListener('load',()=>{const F=fixedTime();if(F!==null){render(F);}else{play();}});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play();}});
window.addEventListener('click',()=>play());
</script>
<script>
const DUR=5.0;
const PTS=[[240.0, 560.5], [287.5, 554.6], [335.0, 553.1], [382.5, 565.0], [430.0, 569.5], [477.5, 576.9], [525.0, 576.9], [572.5, 566.5], [620.0, 585.8], [667.5, 571.0], [715.0, 559.0], [762.5, 566.5], [810.0, 573.9], [857.5, 585.8], [905.0, 568.0], [952.5, 545.6], [1000.0, 535.2], [1047.5, 526.3], [1095.0, 523.3], [1142.5, 508.4], [1190.0, 483.1], [1237.5, 502.5], [1285.0, 523.3], [1332.5, 499.5], [1380.0, 483.1], [1427.5, 483.1], [1475.0, 483.1], [1522.5, 445.9], [1570.0, 422.1], [1617.5, 377.4], [1665.0, 349.1], [1712.5, 344.6], [1760.0, 337.2]]; const BASE=900; const V0=22.8, V1=37.8;
function render(t){
  const title=document.getElementById('title'), sub=document.getElementById('sub');
  title.setAttribute('opacity', easeOut(seg(t,0,0.5))); title.setAttribute('transform', `translate(0,${(1-easeOut(seg(t,0,0.5)))*-18})`);
  sub.setAttribute('opacity', easeOut(seg(t,0.25,0.5)));
  document.getElementById('axes').setAttribute('opacity', easeOut(seg(t,0.4,0.6)));
  // line progress: 1.0s to 4.2s, eased so the climb at the end reads slower
  const p=easeOut(seg(t,1.0,3.2)) * (PTS.length-1);
  const n=Math.floor(p), f=p-n;
  const drawn=PTS.slice(0,n+1).map(q=>q.join(','));
  let head=PTS[n];
  if(n<PTS.length-1){ const a=PTS[n], b=PTS[n+1]; head=[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]; drawn.push(head[0].toFixed(1)+','+head[1].toFixed(1)); }
  document.getElementById('line').setAttribute('points', drawn.join(' '));
  document.getElementById('area').setAttribute('d', `M${PTS[0][0]},${BASE} L`+drawn.join(' L')+` L${head[0].toFixed(1)},${BASE} Z`);
  const dot=document.getElementById('head'); dot.setAttribute('cx',head[0]); dot.setAttribute('cy',head[1]); dot.setAttribute('opacity', t>=1.0?1:0);
  document.getElementById('lab0').setAttribute('opacity', easeOut(seg(t,1.0,0.4)));
  const e=easeOut(seg(t,4.1,0.5)); const l1=document.getElementById('lab1'); l1.setAttribute('opacity',e); l1.textContent=Math.round(V1*e)+'%';
}
</script></head><body>

<path id="area" d="" fill="url(#g)"/>
<polyline id="line" points="" fill="none" stroke="#3A8EF3" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<circle id="head" cx="0" cy="0" r="13" fill="#0070F3" stroke="#FFFFFF" stroke-width="3" opacity="0"/>
