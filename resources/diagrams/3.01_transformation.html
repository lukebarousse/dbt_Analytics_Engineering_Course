<!-- @dsCard group="dbt Course Diagrams" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Transformation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700;800&display=swap');
  :root{
    --bg:#191919; --panel:#202020; --panel2:#232323; --zone:#1E1E1E; --line:#373737;
    --text:#D3D3D3; --muted:#9B9B9B; --faint:#6B6B6B;
    --dbt:#FF694B; --duck:#F2C94C; --blue:#58A6FF;
    --ok:#57AB5A; --err:#E5534B;
    --silverT:#C9CED6; --silverB:#3a3d42;
    --goldT:#E3B341;  --goldB:#4a3a10;
    --mono:'Source Code Pro',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;padding:0;background:var(--bg)}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--sans);color:var(--text);background:var(--bg)}
  .title{position:absolute;left:0;top:34px;width:1920px;text-align:center;
    font-family:var(--mono);font-size:54px;font-weight:700;color:#FFFFFF}
  .tier{position:absolute;box-sizing:border-box;border-radius:16px}
  .tier .bar{position:absolute;left:12px;right:12px;top:10px;height:54px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;gap:12px;
    font-family:var(--mono);font-size:28px;font-weight:700}
  .tier .cap{position:absolute;left:8px;right:8px;top:76px;text-align:center;font-family:var(--sans);font-size:21px;line-height:1.3}
  .card{position:absolute;box-sizing:border-box;height:60px;border-radius:10px;background:var(--panel);
    border:1.5px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;
    font-family:var(--mono);font-size:21px;font-weight:600;color:var(--text)}
  .g-tbl{position:relative;width:38px;height:28px;border:1.5px solid #b9b9b9;border-radius:3px;background:#1f1f1f;flex:none}
  .g-tbl:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:#b9b9b9;border-radius:2px 2px 0 0}
  .g-tbl:after{content:"";position:absolute;left:5px;right:5px;top:11px;height:12px;
    background:repeating-linear-gradient(#383838 0 3px, transparent 3px 6px)}
  .g-tbl.gold{border-color:rgba(227,179,65,.75)} .g-tbl.gold:before{background:var(--goldT)}
  .g-view{position:relative;width:38px;height:28px;border:1.5px solid var(--blue);border-radius:3px;background:#1d2430;flex:none}
  .g-view:before{content:"";position:absolute;left:6px;top:6px;width:17px;height:2.5px;background:var(--blue)}
  .g-view:after{content:"";position:absolute;left:6px;top:12px;width:24px;height:2.5px;background:rgba(88,166,255,.55);
    box-shadow:0 6px 0 rgba(88,166,255,.35)}
  svg.art{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="stage">

  <div class="title">The Transformation</div>

  <!-- ============ STAGING (silver) ============ -->
  <div class="tier" style="left:120px;top:150px;width:460px;height:660px;background:rgba(201,206,214,.05);border:1.5px solid rgba(201,206,214,.4)">
    <div class="bar" style="background:var(--silverB);color:var(--silverT)">staging</div>
    <div class="cap" style="color:var(--silverT)">rename · cast · clean — then stop</div>
  </div>
  <div class="card" style="left:152px;top:320px;width:396px"><span class="g-view"></span>stg_job_postings</div>
  <div class="card" style="left:152px;top:500px;width:396px"><span class="g-view"></span>stg_job_skills</div>

  <!-- ============ INTERMEDIATE (silver) ============ -->
  <div class="tier" style="left:660px;top:150px;width:460px;height:660px;background:rgba(201,206,214,.04);border:1.5px solid rgba(201,206,214,.4)">
    <div class="bar" style="background:var(--silverB);color:var(--silverT)">intermediate</div>
    <div class="cap" style="color:var(--silverT)">the thinking, stated once</div>
  </div>
  <div class="card" style="left:678px;top:400px;width:424px;font-size:19px"><span class="g-view"></span>int_skill_observations</div>

  <!-- ============ MARTS (gold) ============ -->
  <div class="tier" style="left:1200px;top:150px;width:640px;height:660px;background:rgba(227,179,65,.06);border:1.5px solid rgba(227,179,65,.45)">
    <div class="bar" style="background:var(--goldB);color:var(--goldT)">marts</div>
    <div class="cap" style="color:var(--goldT)">the star — what people query</div>
  </div>
  <div class="card" style="left:1330px;top:290px;width:320px;border-color:rgba(227,179,65,.55)"><span class="g-tbl gold"></span>fct_job_postings</div>
  <div class="card" style="left:1240px;top:440px;width:240px"><span class="g-tbl gold"></span>dim_company</div>
  <div class="card" style="left:1560px;top:440px;width:210px"><span class="g-tbl gold"></span>dim_skill</div>
  <div class="card" style="left:1280px;top:580px;width:330px"><span class="g-tbl gold"></span>bridge_job_skills</div>

  <!-- ============ the flow ============ -->
  <svg class="art" viewBox="0 0 1920 1080">
    <defs>
      <marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#EDEDED"/>
      </marker>
    </defs>
    <!-- stg_job_postings → fct (staging feeds the star directly) -->
    <path d="M 550 350 C 850 336, 1180 322, 1326 320" fill="none" stroke="#EDEDED" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ahw)"/>
    <!-- stg_job_skills → int (the re-grain) -->
    <path d="M 550 530 C 612 530, 620 448, 660 434" fill="none" stroke="#EDEDED" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ahw)"/>
    <!-- int → dim_skill (the counts, served) -->
    <path d="M 1104 430 C 1260 424, 1470 445, 1556 464" fill="none" stroke="#EDEDED" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ahw)"/>
    <!-- fct → dim_company (down) · fct → bridge (the right swing) -->
    <path d="M 1400 352 C 1388 392, 1380 412, 1376 434" fill="none" stroke="#EDEDED" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ahw)"/>
    <path d="M 1652 352 C 1760 430, 1730 540, 1616 582" fill="none" stroke="#EDEDED" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ahw)"/>
    <!-- stg_job_skills → bridge (corridor lane) -->
    <path d="M 550 545 C 880 580, 1150 602, 1274 608" fill="none" stroke="#EDEDED" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ahw)"/>
  </svg>

</div>
</body>
</html>
