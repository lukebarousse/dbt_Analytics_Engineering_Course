<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of a dbt project: the six scaffolded folders, the dbt_project.yml badge, and the profile lookup chain to the DuckDB warehouse" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF694B"/>
    </marker>
  </defs>

  <!-- ============ tokens (draft course style) ============
       bg #0F1420 · panel #1A2233 · line #2E3A52 · text #E8EDF5
       muted #93A0B5 · accent(dbt) #FF694B · db(duck) #F2C94C
       chip fill #26314A · chip text #9FB3D9
  ====================================================== -->
  <rect width="1920" height="1080" fill="#0F1420"/>

  <!-- title -->
  <text x="80" y="96" font-size="46" font-weight="700" fill="#E8EDF5">Anatomy of a dbt project</text>
  <text x="80" y="138" font-size="21" fill="#93A0B5">the six folders dbt init scaffolds — and the lesson where each comes alive</text>

  <!-- ============ project panel ============ -->
  <rect x="80" y="180" width="880" height="810" rx="18" fill="#1A2233" stroke="#2E3A52" stroke-width="2"/>
  <!-- panel header -->
  <g transform="translate(116,216)">
    <path d="M0 10 a6 6 0 0 1 6 -6 h20 l8 8 h30 a6 6 0 0 1 6 6 v26 a6 6 0 0 1 -6 6 h-58 a6 6 0 0 1 -6 -6 z" fill="#2E3A52"/>
  </g>
  <text x="200" y="252" font-size="30" font-weight="700" fill="#E8EDF5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">job_postings/</text>
  <text x="430" y="252" font-size="20" fill="#93A0B5">the dbt project</text>

  <!-- badge: dbt_project.yml -->
  <rect x="116" y="286" width="812" height="74" rx="12" fill="#0F1420" stroke="#FF694B" stroke-width="2.5"/>
  <text x="146" y="331" font-size="24" font-weight="700" fill="#FF694B" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">dbt_project.yml</text>
  <text x="386" y="331" font-size="20" fill="#93A0B5">the badge that makes this folder a dbt project</text>

  <!-- folder rows -->
  <!-- row template: icon · name · job · lesson chip -->
  <g font-size="26" font-weight="700" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#E8EDF5">
    <text x="186" y="428">models/</text>
    <text x="186" y="526">seeds/</text>
    <text x="186" y="624">analyses/</text>
    <text x="186" y="722">macros/</text>
    <text x="186" y="820">tests/</text>
    <text x="186" y="918">snapshots/</text>
  </g>
  <g font-size="19" fill="#93A0B5">
    <text x="186" y="458">your SQL — one SELECT per file</text>
    <text x="186" y="556">small lookup CSVs, version-controlled</text>
    <text x="186" y="654">scratch queries — compiled, never built</text>
    <text x="186" y="752">reusable SQL functions you write</text>
    <text x="186" y="850">declared checks on your data</text>
    <text x="186" y="948">row history as data changes over time</text>
  </g>
  <!-- folder icons -->
  <g fill="#2E3A52">
    <path transform="translate(120,404)" d="M0 8 a5 5 0 0 1 5 -5 h16 l7 7 h24 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-47 a5 5 0 0 1 -5 -5 z"/>
    <path transform="translate(120,502)" d="M0 8 a5 5 0 0 1 5 -5 h16 l7 7 h24 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-47 a5 5 0 0 1 -5 -5 z"/>
    <path transform="translate(120,600)" d="M0 8 a5 5 0 0 1 5 -5 h16 l7 7 h24 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-47 a5 5 0 0 1 -5 -5 z"/>
    <path transform="translate(120,698)" d="M0 8 a5 5 0 0 1 5 -5 h16 l7 7 h24 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-47 a5 5 0 0 1 -5 -5 z"/>
    <path transform="translate(120,796)" d="M0 8 a5 5 0 0 1 5 -5 h16 l7 7 h24 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-47 a5 5 0 0 1 -5 -5 z"/>
    <path transform="translate(120,894)" d="M0 8 a5 5 0 0 1 5 -5 h16 l7 7 h24 a5 5 0 0 1 5 5 v22 a5 5 0 0 1 -5 5 h-47 a5 5 0 0 1 -5 -5 z"/>
  </g>
  <!-- lesson chips -->
  <g>
    <rect x="806" y="404" width="104" height="42" rx="21" fill="#26314A"/>
    <rect x="806" y="502" width="104" height="42" rx="21" fill="#26314A"/>
    <rect x="806" y="600" width="104" height="42" rx="21" fill="#26314A"/>
    <rect x="806" y="698" width="104" height="42" rx="21" fill="#26314A"/>
    <rect x="770" y="796" width="140" height="42" rx="21" fill="#26314A"/>
    <rect x="806" y="894" width="104" height="42" rx="21" fill="#26314A"/>
  </g>
  <g font-size="20" font-weight="700" fill="#9FB3D9" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <text x="858" y="432">1.3</text>
    <text x="858" y="530">2.5</text>
    <text x="858" y="628">2.5</text>
    <text x="858" y="726">2.6</text>
    <text x="840" y="824">2.7–2.8</text>
    <text x="858" y="922">2.9</text>
  </g>

  <!-- ============ profiles.yml panel ============ -->
  <rect x="1180" y="330" width="660" height="210" rx="18" fill="#1A2233" stroke="#2E3A52" stroke-width="2"/>
  <text x="1216" y="388" font-size="26" font-weight="700" fill="#E8EDF5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">~/.dbt/profiles.yml</text>
  <text x="1216" y="422" font-size="19" fill="#93A0B5">connection settings — the cable to the warehouse</text>
  <text x="1216" y="470" font-size="19" fill="#93A0B5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">type: duckdb</text>
  <text x="1216" y="502" font-size="19" fill="#93A0B5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">path: ../data/dev.duckdb</text>

  <!-- ============ warehouse cylinder ============ -->
  <path d="M1320 760 a190 34 0 0 1 380 0 v130 a190 34 0 0 1 -380 0 z" fill="#1A2233" stroke="#F2C94C" stroke-width="2.5"/>
  <ellipse cx="1510" cy="760" rx="190" ry="34" fill="#1A2233" stroke="#F2C94C" stroke-width="2.5"/>
  <text x="1510" y="852" font-size="25" font-weight="700" fill="#E8EDF5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">data/dev.duckdb</text>
  <text x="1510" y="886" font-size="18" fill="#93A0B5" text-anchor="middle">DuckDB — your local warehouse</text>

  <!-- ============ the lookup chain (cables) ============ -->
  <!-- badge → profiles.yml -->
  <path d="M928 323 C 1060 323, 1080 435, 1172 435" fill="none" stroke="#FF694B" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1046" y="298" font-size="18" font-weight="600" fill="#FF694B" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">profile: 'job_postings'</text>
  <text x="1046" y="322" font-size="16" fill="#93A0B5" text-anchor="middle">looked up by name</text>
  <!-- profiles.yml → warehouse -->
  <path d="M1510 540 L1510 718" fill="none" stroke="#FF694B" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1534" y="600" font-size="16" fill="#93A0B5">file created lazily</text>
  <text x="1534" y="622" font-size="16" fill="#93A0B5">on first connection</text>

  <!-- footer: repo-shape reminder -->
  <text x="80" y="1046" font-size="18" fill="#93A0B5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">repo root, outside the project:  data/ (raw parquet)  ·  scripts/ (EL)</text>
  <text x="722" y="1046" font-size="18" fill="#5E6B84">— dbt transforms your data; it never owns it</text>
</svg>
