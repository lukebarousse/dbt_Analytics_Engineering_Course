<!-- @dsCard group="dbt Course Diagrams" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dbt build: Three Commands in One</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700;800&display=swap');
  :root{
    --bg:#191919; --panel:#202020; --panel2:#232323; --zone:#1E1E1E; --line:#373737;
    --text:#D3D3D3; --muted:#9B9B9B; --faint:#6B6B6B;
    --dbt:#FF694B; --duck:#F2C94C; --blue:#58A6FF;
    --ok:#57AB5A; --err:#E5534B;
    --mono:'Source Code Pro',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;padding:0;background:var(--bg)}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--sans);color:var(--text);
    background:radial-gradient(900px 480px at 24% -8%, rgba(88,166,255,.05), transparent 60%),
               radial-gradient(900px 520px at 88% 112%, rgba(88,166,255,.03), transparent 60%),var(--bg)}
  .mono{font-family:var(--mono)}
  .title{position:absolute;left:0;top:40px;width:1920px;text-align:center;
    font-family:var(--mono);font-size:54px;font-weight:700;color:#FFFFFF;letter-spacing:-.01em}
  .cmd{position:absolute;top:170px;box-sizing:border-box;width:420px;height:150px;background:var(--panel);
    border:1.5px solid var(--line);border-radius:16px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .cmd .ic{font-size:40px;margin-top:20px}
  .cmd .nm{font-family:var(--mono);font-size:28px;font-weight:800;margin-top:8px}
  .cmd .why{font-family:var(--mono);font-size:19px;color:var(--muted);margin-top:6px}
  .buildbadge{position:absolute;left:660px;top:456px;width:600px;height:120px;background:rgba(255,105,75,.06);
    border:2px solid var(--dbt);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:20px}
  .buildbadge .nm{font-family:var(--mono);font-size:46px;font-weight:800;color:var(--dbt)}
  .zone{position:absolute;left:76px;top:680px;width:1768px;height:320px;background:var(--zone);
    border:1.5px solid var(--line);border-radius:18px}
  .zhead{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--bg);
    padding:2px 22px;font-family:var(--mono);font-size:26px;font-weight:800;color:#fff;white-space:nowrap}
  .node{position:absolute;top:70px;box-sizing:border-box;width:280px;height:150px;background:var(--panel);
    border:1.5px solid var(--line);border-radius:14px;text-align:center}
  .node .ic{font-size:38px;margin-top:16px}
  .node .nm{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:8px}
  .node .st{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:8px}
  .zcap{position:absolute;width:1768px;top:246px;text-align:center;font-family:var(--mono);font-size:23px;font-weight:700;color:var(--muted)}
  svg.art{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="stage">

  <div class="title">dbt build: Three Commands in One</div>

  <!-- ============ the three commands ============ -->
  <div class="cmd" style="left:126px">
    <div class="ic">🌱</div>
    <div class="nm">dbt seed</div>
    <div class="why">loads reference CSVs</div>
  </div>
  <div class="cmd" style="left:750px">
    <div class="ic">🏗️</div>
    <div class="nm">dbt run</div>
    <div class="why">builds the models</div>
  </div>
  <div class="cmd" style="left:1374px">
    <div class="ic">🛡️</div>
    <div class="nm">dbt test</div>
    <div class="why">checks the data</div>
  </div>

  <!-- ============ the one command ============ -->
  <div class="buildbadge">
    <span style="font-size:44px">🚀</span>
    <span class="nm">dbt build</span>
  </div>

  <!-- ============ one pass, DAG order ============ -->
  <div class="zone">
    <div class="zhead">⛓ one pass · DAG order</div>
    <div class="node" style="left:100px">
      <div class="ic">🏗️</div>
      <div class="nm">model</div>
      <div class="st" style="color:var(--ok)">✓ built</div>
    </div>
    <div class="node" style="left:520px;border-color:rgba(229,83,75,.6)">
      <div class="ic">🛡️</div>
      <div class="nm">its test</div>
      <div class="st" style="color:var(--err)">✗ ERROR</div>
    </div>
    <div class="node" style="left:940px;border-style:dashed;opacity:.55">
      <div class="ic">🏗️</div>
      <div class="nm">next model</div>
      <div class="st" style="color:var(--muted)">⏭ SKIP</div>
    </div>
    <div class="node" style="left:1360px;border-style:dashed;opacity:.55">
      <div class="ic">🛡️</div>
      <div class="nm">its test</div>
      <div class="st" style="color:var(--muted)">⏭ SKIP</div>
    </div>
    <div class="zcap">🛑 a failed test stops everything downstream</div>
  </div>

  <svg class="art" viewBox="0 0 1920 1080">
    <defs>
      <marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#FF694B"/>
      </marker>
      <marker id="aw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#EDEDED"/>
      </marker>
    </defs>
    <!-- three commands → dbt build -->
    <path d="M 336 328 C 336 420, 700 380, 742 452" fill="none" stroke="#FF694B" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ao)"/>
    <line x1="960" y1="328" x2="960" y2="448" stroke="#FF694B" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ao)"/>
    <path d="M 1584 328 C 1584 420, 1220 380, 1178 452" fill="none" stroke="#FF694B" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ao)"/>
    <!-- dbt build → the pass -->
    <line x1="960" y1="584" x2="960" y2="668" stroke="#FF694B" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ao)"/>
    <!-- pass sequence (y=825) -->
    <line x1="384" y1="825" x2="508" y2="825" stroke="#EDEDED" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#aw)"/>
    <line x1="804" y1="825" x2="928" y2="825" stroke="#EDEDED" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#aw)"/>
    <line x1="1224" y1="825" x2="1348" y2="825" stroke="#EDEDED" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#aw)"/>
  </svg>

</div>
</body>
</html>
